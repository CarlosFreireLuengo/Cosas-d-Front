<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página con Bootstrap 5</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <form>
            <div class = "form-group">
                <label for="txtEmail">Email:</label>
                <input type="email" class="form-control" id="txtEmail" placeholder="Ingrese su email">
            </div>
            <div class = "form-group">
                <label for="txtPassword">Contraseña:</label>
                <input type="password" class="form-control" id="txtPassword" placeholder="Ingrese su contraseña">
            </div>

            <div class = "checkbox">
                <label for="chkRecibir">
                    <input type="checkbox" id="chkRecibir"> Deseo recibir notificaciones
                </label>

            </div>
            <button type="submit" class="btn btn-default">Enviar</button >
        </form>

        <button type="button" class="btn btn-default">Botón de ejemplo</button>
        <button type="button" class="btn btn-primary btn-lg">Botón principal</button>
        <button type="button" class="btn btn-success btn-sm active">Botón de éxito</button>
        <button type="button" class="btn btn-info">Botón de información</button>
        <button type="button" class="btn btn-warning disabled">Botón de advertencia</button>
        <button type="button" class="btn btn-danger">Botón de peligro</button>
        <button type="button" class="btn btn-link">Botón secundario</button>

        <div class="btn-group">
            <button class="btn btn-default">Izq</button>
            <button class="btn btn-default">Center</button>
            <button class="btn btn-default">Dch</button>
        </div>



        <p>
            <a href="#" class="btn btn-success btn-lg">
                <span class="glyphicon glyphicon-print" aria-hidden="true"></span>
            </a>
        </p>



    </div>
 
   
    <!-- JavaScript de Bootstrap 5 (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
