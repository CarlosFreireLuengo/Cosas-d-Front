<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página con Bootstrap 5</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h2 class="mb-4">Lista de Productos</h2>
        <div class="mb-4">
            <input type="text" id="buscador" class="form-control" placeholder="Buscar por nombre o categoría">
        </div>

        <div class="row g-4" id="contenedorTarjetas"></div>

    </div>


    <!-- JavaScript de Bootstrap 5 (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
<script>
    const productos = [
        { nombre: 'Teclado Mecánico', categoria: 'Periféricos', precio: 80 },
        { nombre: 'Monitor 4K', categoria: 'Pantallas', precio: 350 },
        { nombre: 'Ratón Inalámbrico', categoria: 'Periféricos', precio: 40 },
        { nombre: 'Silla Gamer', categoria: 'Mobiliario', precio: 200 },
        { nombre: 'Auriculares Bluetooth', categoria: 'Audio', precio: 90 }
    ];


    const contenedor = document.querySelector('#contenedorTarjetas');
    const buscador = document.querySelector('#buscador');

    function renderizarProductos(items){
        contenedor.innerHTML = '';
        if(items.length === 0){
            contenedor.innerHTML = '<div class="col-12"><p class="text-muted">No se encontraron productos.</p></div>';
            return;
        }

        items.forEach(prod =>{
            const col = document.createElement('div');
            col.className = 'col-md-4 col-sm-6';
            col.innerHTML = `
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2">${prod.categoria}</span>
                        <h5 class="card-title">${prod.nombre}</h5>
                        <p class="card-text  fw-bold text-primary" >Precio: $${prod.precio}</p>
                    </div>
                </div>
            `;

            contenedor.appendChild(col);
        })
    }

    buscador.addEventListener('input',(e) =>{
        const termino = e.target.value.toLowerCase();
        const filtrados = productos.filter(p =>{
            return p.nombre.toLowerCase().includes(termino) || p.categoria.toLowerCase().includes(termino);
        });
        renderizarProductos(filtrados);
    });

    renderizarProductos(productos);
</script>
