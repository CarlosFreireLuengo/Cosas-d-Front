<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LAB 2 - Gestor de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 p-4">
    <div class="container" style="max-width: 700px;">
        <h1 class="h3 mb-4 text-center">Gestor de Tareas</h1>

        <!-- Agregar tareas -->
        <form id="formTarea" class="input-group mb-2" novalidate>
            <input type="text" id="inputTarea" class="form-control" placeholder="Escribe una nueva tarea..." autocomplete="off">
            <button type="submit" class="btn btn-primary">Añadir</button>
        </form>
        <div id="errorTarea" class="text-danger small mb-3 d-none">La tarea no puede estar vacía.</div>

        <!-- Contadores -->
        <div class="d-flex gap-2 mb-3">
            <span class="badge text-bg-secondary">Total: <span id="contTotal">0</span></span>
            <span class="badge text-bg-success">Completadas: <span id="contCompletadas">0</span></span>
        </div>

        <!-- Lista de tareas -->
        <ul id="listaTareas" class="list-group"></ul>
    </div>

    <!-- Modal para editar -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar tarea</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="inputEditar" class="form-control" autocomplete="off">
                    <div id="errorEditar" class="text-danger small mt-2 d-none">El título no puede estar vacío.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnGuardarEdicion" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="funciones.js"></script>
</body>
</html>
