<div style="padding: 20px; font-family: Arial, sans-serif;">
  <div style="display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap;">
    <!-- Columna izquierda: Tabla + botón Create New Course -->
    <div style="flex: 2; min-width: 520px;">
      <table style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr style="border-bottom: 2px solid #dee2e6; text-align: left;">
            <th style="padding: 8px;">ID</th>
            <th style="padding: 8px;">Title</th>
            <th style="padding: 8px;">Seat Capacity</th>
            <th style="padding: 8px;">Price</th>
            <th style="padding: 8px;">Instructor Name</th>
            <th style="padding: 8px;"></th>
          </tr>
        </thead>
        <tbody>
          @for (course of courses; track course.id) {
            <tr style="border-bottom: 1px solid #e9ecef;">
              <td style="padding: 8px;">{{ course.id }}</td>
              <td style="padding: 8px;">{{ course.title }}</td>
              <td style="padding: 8px;">{{ course.seatCapacity }}</td>
              <td style="padding: 8px;">${{ course.price }}</td>
              <td style="padding: 8px;">{{ course.instructorName }}</td>
              <td style="padding: 8px; white-space: nowrap;">
                <button
                  type="button"
                  (click)="deleteCourse(course.id)"
                  style="background-color: #dc3545; color: #fff; border: none; padding: 4px 10px; border-radius: 3px; cursor: pointer; margin-right: 4px;">
                  Delete
                </button>
                <button
                  type="button"
                  (click)="startEdit(course)"
                  style="background-color: #ffc107; color: #212529; border: none; padding: 4px 10px; border-radius: 3px; cursor: pointer;">
                  Edit
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>

      <div style="margin-top: 14px;">
        <button
          type="button"
          (click)="startCreate()"
          style="background-color: #0d6efd; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer;">
          Create New Course
        </button>
      </div>
    </div>

    <!-- Columna derecha: Formulario Edit Course -->
    @if (editingCourse) {
      <div style="flex: 1; min-width: 280px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden;">
        <div style="background-color: #ffc107; color: #fff; padding: 10px 14px; font-weight: bold;">
          {{ isNewCourse ? 'New Course' : 'Edit Course' }}
        </div>

        <div style="padding: 14px;">
          <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 13px; color: #6c757d; margin-bottom: 4px;">Title</label>
            <input
              type="text"
              [value]="editingCourse.title"
              (input)="editingCourse.title = $any($event.target).value"
              style="width: 100%; padding: 6px 8px; border: 1px solid #ced4da; border-radius: 3px; box-sizing: border-box;" />
          </div>

          <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 13px; color: #6c757d; margin-bottom: 4px;">Seat Capacity</label>
            <input
              type="number"
              [value]="editingCourse.seatCapacity"
              (input)="editingCourse.seatCapacity = $any($event.target).valueAsNumber"
              style="width: 100%; padding: 6px 8px; border: 1px solid #ced4da; border-radius: 3px; box-sizing: border-box;" />
          </div>

          <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 13px; color: #6c757d; margin-bottom: 4px;">Price</label>
            <input
              type="number"
              step="0.01"
              [value]="editingCourse.price"
              (input)="editingCourse.price = $any($event.target).valueAsNumber"
              style="width: 100%; padding: 6px 8px; border: 1px solid #ced4da; border-radius: 3px; box-sizing: border-box;" />
          </div>

          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 13px; color: #6c757d; margin-bottom: 4px;">Instructor Name</label>
            <input
              type="text"
              [value]="editingCourse.instructorName"
              (input)="editingCourse.instructorName = $any($event.target).value"
              style="width: 100%; padding: 6px 8px; border: 1px solid #ced4da; border-radius: 3px; box-sizing: border-box;" />
          </div>

          <div style="display: flex; gap: 8px;">
            <button
              type="button"
              (click)="saveCourse()"
              style="background-color: #ffc107; color: #fff; border: none; padding: 6px 14px; border-radius: 3px; cursor: pointer;">
              Save
            </button>
            <button
              type="button"
              (click)="cancelEdit()"
              style="background-color: #6c757d; color: #fff; border: none; padding: 6px 14px; border-radius: 3px; cursor: pointer;">
              Cancel
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
