<div class="container-fluid mt-3">
  <app-message></app-message>

  <div class="row">

    <!-- COLUMNA IZQUIERDA: Tabla de Cursos -->
    <div class="col-md-8">
      <table class="table table-sm table-bordered table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Seat Capacity</th>
            <th>Price</th>
            <th>Instructor Name</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of courses">
            <td>{{ item.id }}</td>
            <td>{{ item.title }}</td>
            <td>{{ item.seatCapacity }}</td>
            <td>{{ item.price | currency:'USD':'symbol':'1.2-2' }}</td>
            <td>{{ item.instructorName }}</td>
            <td class="text-center">
              <button
                type="button"
                class="btn btn-danger btn-sm me-1"
                (click)="deleteCourse(item.id)">
                Delete
              </button>
              <button
                type="button"
                class="btn btn-warning btn-sm"
                (click)="startEdit(item)">
                Edit
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <button
        type="button"
        class="btn btn-primary btn-sm mt-2"
        (click)="startCreate()">
        Create New Course
      </button>
    </div>

    <!-- COLUMNA DERECHA: Formulario de Edición / Creación -->
    <div class="col-md-4">
      <div class="bg-warning text-white p-2 mb-3 fw-bold">
        {{ isNewCourse ? 'Create Course' : 'Edit Course' }}
      </div>

      <form *ngIf="editingCourse" (ngSubmit)="saveCourse()">
        <div class="mb-2">
          <label class="form-label mb-1">Title</label>
          <input
            type="text"
            class="form-control form-control-sm"
            name="title"
            [(ngModel)]="editingCourse.title"
            required
          />
        </div>

        <div class="mb-2">
          <label class="form-label mb-1">Seat Capacity</label>
          <input
            type="number"
            class="form-control form-control-sm"
            name="seatCapacity"
            [(ngModel)]="editingCourse.seatCapacity"
            required
          />
        </div>

        <div class="mb-2">
          <label class="form-label mb-1">Price</label>
          <input
            type="number"
            step="0.01"
            class="form-control form-control-sm"
            name="price"
            [(ngModel)]="editingCourse.price"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label mb-1">Instructor Name</label>
          <input
            type="text"
            class="form-control form-control-sm"
            name="instructorName"
            [(ngModel)]="editingCourse.instructorName"
            required
          />
        </div>

        <button type="submit" class="btn btn-warning text-white btn-sm me-1">
          Save
        </button>
        <button
          type="button"
          class="btn btn-secondary btn-sm"
          (click)="cancelEdit()">
          Cancel
        </button>
      </form>
    </div>

  </div>
</div>
