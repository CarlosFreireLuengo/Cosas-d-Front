<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica 3 - Contador de caracteres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm" style="max-width: 520px; width: 100%;">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Publicar un mensaje</h1>
                <label for="mensaje" class="form-label">Tu mensaje</label>
                <textarea id="mensaje" class="form-control" rows="4"
                    placeholder="Escribe algo (máximo 100 caracteres)"></textarea>
                <div id="contador" class="form-text mt-2" aria-live="polite">Te quedan 100 caracteres</div>
                <button id="btnPublicar" class="btn btn-primary mt-3">Publicar</button>
            </div>
        </div>
    </main>

    <script>
        const LIMITE = 100;
        const textarea = document.getElementById('mensaje');
        const contador = document.getElementById('contador');
        const btnPublicar = document.getElementById('btnPublicar');

        function actualizar() {
            const restantes = LIMITE - textarea.value.length;
            const excedido = restantes < 0;

            textarea.classList.toggle('border-danger', excedido);
            contador.classList.toggle('text-danger', excedido);
            btnPublicar.disabled = excedido || textarea.value.trim() === '';

            if (excedido) {
                contador.textContent = 'Te has pasado por ' + Math.abs(restantes) + ' caracteres';
            } else {
                contador.textContent = 'Te quedan ' + restantes + ' caracteres';
            }
        }

        textarea.addEventListener('input', actualizar);
        actualizar();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
