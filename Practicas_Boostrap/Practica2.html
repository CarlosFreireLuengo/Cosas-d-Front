<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica 2 - Alternador de tema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body data-bs-theme="light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm" style="max-width: 480px; width: 100%;">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="h4 mb-0">Panel de ajustes</h1>
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" role="switch" id="switchTema">
                        <label class="form-check-label" for="switchTema" id="etiquetaTema">Modo claro</label>
                    </div>
                </div>
                <p class="text-body-secondary">
                    Activa el interruptor para cambiar entre el tema claro y el oscuro de Bootstrap 5.
                </p>
                <div class="alert alert-info mb-0" id="estado">Tema actual: claro</div>
            </div>
        </div>
    </main>

    <script>
        const body = document.body;
        const interruptor = document.getElementById('switchTema');
        const etiqueta = document.getElementById('etiquetaTema');
        const estado = document.getElementById('estado');

        interruptor.addEventListener('change', () => {
            const tema = interruptor.checked ? 'dark' : 'light';
            body.setAttribute('data-bs-theme', tema);
            etiqueta.textContent = interruptor.checked ? 'Modo oscuro' : 'Modo claro';
            estado.textContent = 'Tema actual: ' + (interruptor.checked ? 'oscuro' : 'claro');
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
