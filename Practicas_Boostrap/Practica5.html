<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica 5 - Reloj digital y fases del día</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm text-center" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">
                <h1 class="h5 text-body-secondary mb-3">Reloj digital</h1>
                <p id="hora" class="display-3 fw-semibold mb-1" aria-live="off">00:00:00</p>
                <p id="fecha" class="text-body-secondary mb-3"></p>
                <span id="fase" class="badge fs-6 px-3 py-2">Cargando…</span>
            </div>
        </div>
    </main>

    <script>
        const elHora = document.getElementById('hora');
        const elFecha = document.getElementById('fecha');
        const elFase = document.getElementById('fase');

        // Colores personalizados (Bootstrap no trae naranja ni gris oscuro como text-bg-*)
        const FASES = {
            manana: { texto: 'Mañana', clases: ['text-bg-primary'], estilo: '' },
            tarde: { texto: 'Tarde', clases: [], estilo: 'background-color:#fd7e14;color:#fff;' },
            noche: { texto: 'Noche', clases: ['text-bg-dark'], estilo: '' }
        };

        function obtenerFase(hora) {
            if (hora >= 6 && hora < 12) return FASES.manana;
            if (hora >= 12 && hora < 20) return FASES.tarde;
            return FASES.noche;
        }

        function actualizarReloj() {
            const ahora = new Date();
            elHora.textContent = ahora.toLocaleTimeString('es-ES');
            elFecha.textContent = ahora.toLocaleDateString('es-ES', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });

            const fase = obtenerFase(ahora.getHours());
            elFase.className = 'badge fs-6 px-3 py-2 ' + fase.clases.join(' ');
            elFase.style.cssText = fase.estilo;
            elFase.textContent = fase.texto;
        }

        actualizarReloj();
        setInterval(actualizarReloj, 1000);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
