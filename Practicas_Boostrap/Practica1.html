<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica 1 - Contador interactivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm text-center" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Contador interactivo</h1>
                <span id="badge" class="badge text-bg-secondary fs-1 px-4 py-3 mb-4" aria-live="polite">0</span>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <button id="btnDecrementar" class="btn btn-outline-danger">Decrementar</button>
                    <button id="btnResetear" class="btn btn-outline-secondary">Resetear</button>
                    <button id="btnIncrementar" class="btn btn-outline-success">Incrementar</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let contador = 0;
        const badge = document.getElementById('badge');

        function actualizar() {
            badge.textContent = contador;
            badge.classList.remove('text-bg-success', 'text-bg-danger', 'text-bg-secondary');
            if (contador > 0) badge.classList.add('text-bg-success');
            else if (contador < 0) badge.classList.add('text-bg-danger');
            else badge.classList.add('text-bg-secondary');
        }

        document.getElementById('btnIncrementar').addEventListener('click', () => { contador++; actualizar(); });
        document.getElementById('btnDecrementar').addEventListener('click', () => { contador--; actualizar(); });
        document.getElementById('btnResetear').addEventListener('click', () => { contador = 0; actualizar(); });

        actualizar();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
