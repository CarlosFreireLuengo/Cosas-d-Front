<form [formGroup]="courseForm" (ngSubmit)="onSubmit()" class="p-3 border rounded bg-light form-container">
  <h3 class="mb-3">Formulario de entrada</h3>
  
  <div class="mb-3">
    <label class="form-label">Course Title</label>
    <input type="text" class="form-control" formControlName="title" />
  </div>
  
  <div class="mb-3">
    <label class="form-label">Seat Capacity</label>
    <input type="text" class="form-control" formControlName="seatCapacity" />
  </div>
  
  <div class="mb-3">
    <label class="form-label">Instructor Name</label>
    <input type="text" class="form-control" formControlName="instructorName" />
  </div>
  
  <button type="submit" class="btn btn-create" [disabled]="!courseForm.valid">Create</button>
</form>
