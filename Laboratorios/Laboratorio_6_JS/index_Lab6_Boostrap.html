<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 6 con Bootstrap 5</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Tarjetas de Usuarios dinámicas</h1>
        <div id="contenedor" class="row g-3"></div>
        <button id="btnRestaurar" class="btn btn-primary mb-3">Restaurar usuarios</button>
    </div>

    <!-- JavaScript de Bootstrap 5 (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
<script>
        const usuarios = [
            { id: 1, nombre: "Ana", edad: 25 },
            { id: 2, nombre: "Carlos", edad: 30 },
            { id: 3, nombre: "Luis", edad: 28 },
        ];

        const contenedor = document.querySelector("#contenedor");

        // Mensaje cuando no queda ninguna tarjeta
        function mostrarVacio() {
            contenedor.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-secondary text-center mb-0">
                        No hay usuarios. Pulsa "Restaurar usuarios".
                    </div>
                </div>`;
        }

        // Genera dinámicamente una tarjeta de Bootstrap por cada usuario
        function mostrarUsuarios(lista) {
            if (lista.length === 0) {
                mostrarVacio();
                return;
            }

            contenedor.innerHTML = lista
                .map(
                    (usuario) => `
                <div class="col-12 col-sm-6 tarjeta" data-id="${usuario.id}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">${usuario.nombre}</h5>
                            <p class="card-text">Edad: ${usuario.edad} años</p>
                            <button class="btn btn-danger btn-sm eliminar" data-id="${usuario.id}">Eliminar</button>
                        </div>
                    </div>
                </div>`
                )
                .join("");
        }

        // Un único listener en el contenedor padre (delegación de eventos)
        contenedor.addEventListener("click", (evento) => {
            const boton = evento.target.closest("button.eliminar");
            if (!boton) return;

            const id = boton.dataset.id;
            const tarjeta = contenedor.querySelector(`.tarjeta[data-id="${id}"]`);
            if (tarjeta) {
                tarjeta.remove();
                console.log(`Tarjeta del usuario ${id} eliminada`);
            }

            // Si ya no quedan tarjetas, mostramos el mensaje de vacío
            if (contenedor.querySelectorAll(".tarjeta").length === 0) {
                mostrarVacio();
            }
        });

        document.querySelector("#btnRestaurar").addEventListener("click", () => mostrarUsuarios(usuarios));

        mostrarUsuarios(usuarios);
    </script>
