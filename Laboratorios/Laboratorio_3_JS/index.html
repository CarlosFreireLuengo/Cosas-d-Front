<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 3: Catálogo de Productos y Ofertas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.25rem;
            box-sizing: border-box;
        }

        button {
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
        }

        .ficha {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .ficha p {
            margin: 0.25rem 0;
        }

        .oferta {
            border-color: #2e7d32;
            background: #f1f8e9;
        }

        .tachado {
            text-decoration: line-through;
            color: #777;
        }
    </style>
</head>

<body>
    <h1>Catálogo de Productos y Ofertas</h1>

    <label for="nombre">Nombre del producto</label>
    <input type="text" id="nombre" placeholder="Teclado">

    <label for="precio">Precio (€)</label>
    <input type="number" id="precio" min="0" step="0.01" placeholder="50">

    <label for="descuento">Descuento (%) (opcional, déjalo vacío si no está en oferta)</label>
    <input type="number" id="descuento" min="0" max="100" placeholder="20">

    <button id="btnAgregar">Añadir al catálogo</button>

    <div id="catalogo"></div>

    <script>
        class Producto {
            constructor(nombre, precio) {
                this.nombre = nombre;
                this.precio = precio;
            }

            obtenerPrecioFinal() {
                return this.precio;
            }
        }

        class ProductoEnOferta extends Producto {
            constructor(nombre, precio, descuento) {
                super(nombre, precio);
                this.descuento = descuento; // porcentaje
            }

            // Sobrescribe el método de la clase base aplicando el descuento
            obtenerPrecioFinal() {
                return this.precio - (this.precio * this.descuento) / 100;
            }
        }

        const catalogo = [];

        function pintarCatalogo() {
            const contenedor = document.getElementById("catalogo");
            contenedor.innerHTML = "";

            catalogo.forEach((producto) => {
                const ficha = document.createElement("div");
                ficha.className = "ficha";

                const titulo = document.createElement("p");
                const negrita = document.createElement("strong");
                negrita.textContent = producto.nombre;
                titulo.appendChild(negrita);
                ficha.appendChild(titulo);

                if (producto instanceof ProductoEnOferta) {
                    ficha.classList.add("oferta");
                    const original = document.createElement("p");
                    original.innerHTML = `Precio original: <span class="tachado">${producto.precio.toFixed(2)} €</span> (-${producto.descuento}%)`;
                    ficha.appendChild(original);
                }

                const final = document.createElement("p");
                final.textContent = `Precio final: ${producto.obtenerPrecioFinal().toFixed(2)} €`;
                ficha.appendChild(final);

                contenedor.appendChild(ficha);
            });
        }

        document.getElementById("btnAgregar").addEventListener("click", () => {
            const nombre = document.getElementById("nombre").value.trim();
            const precio = parseFloat(document.getElementById("precio").value);
            const descuentoTexto = document.getElementById("descuento").value;
            const descuento = parseFloat(descuentoTexto);

            if (!nombre || Number.isNaN(precio) || precio < 0) {
                alert("Introduce un nombre y un precio válido.");
                return;
            }

            const producto = descuentoTexto !== "" && !Number.isNaN(descuento)
                ? new ProductoEnOferta(nombre, precio, descuento)
                : new Producto(nombre, precio);

            catalogo.push(producto);
            console.log(`${producto.nombre}: ${producto.obtenerPrecioFinal().toFixed(2)} €`);
            pintarCatalogo();
        });
    </script>
</body>

</html>
